name: Deploy preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and publish preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected revision and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd build
          git init
          git checkout -b v3.10.2_HTML_test
          git add --all
          git commit -m "Preview ${GITHUB_SHA}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git push --force origin HEAD:v3.10.2_HTML_test
