<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" aria-labelledby="title desc" role="img" viewBox="0 0 1400 500"><title id="title">TLSR8258 完整開發鏈路</title><desc id="desc">電腦前端經 Burning EVK 與 SWS 連接 TLSR8258，韌體啟動後再經 UART 或 BLE 驗證</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><linearGradient id="line" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient><filter id="glow" width="160%" height="200%" x="-30%" y="-50%"><feGaussianBlur result="b" stdDeviation="5"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#818cf8" d="M0 0L12 6 0 12z"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#94a3b8" stroke-opacity=".06" d="M40 0H0V40"/></pattern></defs><rect width="1400" height="500" fill="url(#bg)" rx="28"/><rect width="1400" height="500" fill="url(#grid)" rx="28"/><g font-family="Segoe UI, Noto Sans TC, PingFang TC, sans-serif" text-anchor="middle"><text x="700" y="58" fill="#f8fafc" font-size="30" font-weight="750">TLSR8258 開發、燒錄與驗證鏈路</text><text x="700" y="91" fill="#94a3b8" font-size="17">把工具、下載器、單線介面與產品驗收分成四個層級</text><g transform="translate(74 150)"><rect width="250" height="170" fill="#111827" stroke="#22d3ee" stroke-width="2" rx="24"/><circle cx="125" cy="45" r="23" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/><path fill="none" stroke="#67e8f9" stroke-linecap="round" stroke-width="3" d="M112 40h26v15h-26zM106 60h38"/><text x="125" y="100" fill="#f8fafc" font-size="23" font-weight="700">PC 前端</text><text x="125" y="132" fill="#a5f3fc" font-size="17">GUI · CLI · WebUSB</text></g><g transform="translate(403 150)"><rect width="250" height="170" fill="#111827" stroke="#818cf8" stroke-width="2" rx="24"/><rect width="46" height="46" x="102" y="25" fill="#818cf8" fill-opacity=".16" stroke="#818cf8" rx="9"/><path stroke="#a5b4fc" stroke-linecap="round" stroke-width="3" d="M112 38h26M112 49h26M112 60h16"/><text x="125" y="100" fill="#f8fafc" font-size="23" font-weight="700">Burning EVK</text><text x="125" y="132" fill="#c7d2fe" font-size="17">USB 身份與下載器韌體</text></g><g transform="translate(732 150)"><rect width="250" height="170" fill="#111827" stroke="#a78bfa" stroke-width="2" rx="24"/><path fill="none" stroke="#c4b5fd" stroke-linecap="round" stroke-width="4" d="M94 51h62M106 35v32M125 27v48M144 35v32"/><text x="125" y="100" fill="#f8fafc" font-size="23" font-weight="700">SWM / SWS</text><text x="125" y="132" fill="#ddd6fe" font-size="17">單線燒錄與指令級除錯</text></g><g transform="translate(1061 150)"><rect width="250" height="170" fill="#111827" stroke="#c084fc" stroke-width="2" rx="24"/><rect width="62" height="54" x="94" y="24" fill="#c084fc" fill-opacity=".16" stroke="#c084fc" rx="8"/><circle cx="107" cy="37" r="4" fill="#67e8f9"/><text x="125" y="100" fill="#f8fafc" font-size="23" font-weight="700">TLSR8258</text><text x="125" y="132" fill="#e9d5ff" font-size="17">Flash · TC32 · BLE</text></g></g><g fill="none" stroke="url(#line)" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"><path d="M330 235h59"/><path d="M659 235h59"/><path d="M988 235h59"/></g><g font-family="Segoe UI, Noto Sans TC, sans-serif" font-size="14" text-anchor="middle"><text x="359" y="216" fill="#94a3b8">USB</text><text x="688" y="216" fill="#94a3b8">SWM</text><text x="1017" y="216" fill="#94a3b8">SWS</text></g><path fill="none" stroke="#64748b" stroke-dasharray="8 8" stroke-width="2" marker-end="url(#arrow)" d="M1186 328v75H215v-62"/><text x="700" y="430" fill="#cbd5e1" font-family="Segoe UI, Noto Sans TC, sans-serif" font-size="18" text-anchor="middle">Reset 後，以 UART／BLE 讀回版本與 Build ID，形成可驗證閉環</text></svg>