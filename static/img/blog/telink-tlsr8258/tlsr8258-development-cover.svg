<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">泰凌微 TLSR8258 開發實戰</title>
  <desc id="desc">從電腦、BDT、Burning EVK、SWS 到 TLSR8258 的韌體開發鏈路</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#172554"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#67e8f9" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="36" fill="url(#grid)"/>
  <circle cx="1290" cy="180" r="340" fill="url(#glow)"/>
  <circle cx="230" cy="760" r="300" fill="#a855f7" fill-opacity="0.08"/>

  <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.52">
    <path d="M0 170h155l70 70h190"/>
    <path d="M0 730h210l58-58h155"/>
    <path d="M1180 88v92l74 74h346"/>
    <path d="M1165 780h165l62-62h208"/>
  </g>
  <g fill="#67e8f9" filter="url(#softGlow)">
    <circle cx="225" cy="240" r="7"/><circle cx="268" cy="672" r="7"/>
    <circle cx="1254" cy="254" r="7"/><circle cx="1392" cy="718" r="7"/>
  </g>

  <g transform="translate(1030 300)">
    <rect x="0" y="0" width="350" height="350" rx="44" fill="url(#chip)" stroke="url(#accent)" stroke-width="5"/>
    <rect x="44" y="44" width="262" height="262" rx="30" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.55" stroke-width="2"/>
    <g stroke="#c4b5fd" stroke-width="12" stroke-linecap="round">
      <path d="M30-22v42M86-22v42M142-22v42M208-22v42M264-22v42M320-22v42"/>
      <path d="M30 330v42M86 330v42M142 330v42M208 330v42M264 330v42M320 330v42"/>
      <path d="M-22 30h42M-22 86h42M-22 142h42M-22 208h42M-22 264h42M-22 320h42"/>
      <path d="M330 30h42M330 86h42M330 142h42M330 208h42M330 264h42M330 320h42"/>
    </g>
    <circle cx="78" cy="78" r="12" fill="#22d3ee" filter="url(#softGlow)"/>
    <text x="175" y="158" fill="#f8fafc" font-family="Segoe UI, Noto Sans TC, sans-serif" font-size="35" font-weight="700" text-anchor="middle">TELINK</text>
    <text x="175" y="208" fill="#67e8f9" font-family="Consolas, monospace" font-size="31" font-weight="700" text-anchor="middle">TLSR8258</text>
    <text x="175" y="252" fill="#c4b5fd" font-family="Segoe UI, Noto Sans TC, sans-serif" font-size="22" text-anchor="middle">BLE · TC32 · SWS</text>
  </g>

  <g font-family="Segoe UI, Noto Sans TC, PingFang TC, sans-serif">
    <rect x="118" y="116" width="250" height="48" rx="24" fill="#22d3ee" fill-opacity="0.13" stroke="#22d3ee" stroke-opacity="0.65"/>
    <text x="243" y="148" fill="#a5f3fc" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="2">EMBEDDED FIELD GUIDE</text>
    <text x="112" y="278" fill="#f8fafc" font-size="72" font-weight="800">泰凌微 TLSR8258</text>
    <text x="112" y="370" fill="url(#accent)" font-size="78" font-weight="800">開發實戰</text>
    <text x="118" y="440" fill="#cbd5e1" font-size="30">從 SWS 燒錄到可驗證的韌體交付</text>
  </g>

  <g transform="translate(118 530)" font-family="Segoe UI, Noto Sans TC, sans-serif">
    <g>
      <rect width="190" height="76" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="95" y="31" fill="#67e8f9" font-size="17" font-weight="700" text-anchor="middle">BUILD</text>
      <text x="95" y="56" fill="#f8fafc" font-size="20" text-anchor="middle">TC32 / CMake</text>
    </g>
    <g transform="translate(214)">
      <rect width="190" height="76" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#818cf8" stroke-opacity="0.55"/>
      <text x="95" y="31" fill="#a5b4fc" font-size="17" font-weight="700" text-anchor="middle">FLASH</text>
      <text x="95" y="56" fill="#f8fafc" font-size="20" text-anchor="middle">BDT / SWS</text>
    </g>
    <g transform="translate(428)">
      <rect width="190" height="76" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#c084fc" stroke-opacity="0.55"/>
      <text x="95" y="31" fill="#d8b4fe" font-size="17" font-weight="700" text-anchor="middle">VERIFY</text>
      <text x="95" y="56" fill="#f8fafc" font-size="20" text-anchor="middle">Hash / Build ID</text>
    </g>
  </g>

  <text x="118" y="790" fill="#94a3b8" font-family="Segoe UI, Noto Sans TC, sans-serif" font-size="22">w0x7ce · El Jardín Secreto · 2026</text>
</svg>
